[package]
name = "gfnusage"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gfnusage_lib"
path = "src/lib.rs"

[[bin]]
name = "gfnusage"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
percent-encoding = "2"
thiserror = "2"
ab_glyph = "0.2"
chrono-tz = "0.10"
iana-time-zone = "0.1"
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
