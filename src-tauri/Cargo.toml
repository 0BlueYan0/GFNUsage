[package]
name = "gfnusage"
version = "0.4.0"
edition = "2021"
# 1.77.2 是 tauri-plugin-{updater,log,single-instance,autostart} 的下限，
# 不是我們自己的需求。壓在 1.77 的話 cargo 會退回去抓那幾個外掛的 rc 版。
rust-version = "1.77.2"

[lib]
name = "gfnusage_lib"
path = "src/lib.rs"

[[bin]]
name = "gfnusage"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
base64 = "0.22"
percent-encoding = "2"
thiserror = "2"
ab_glyph = "0.2"
chrono-tz = "0.10"
iana-time-zone = "0.1"
sha2 = "0.10"
getrandom = "0.3"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
log = "0.4"

# 更新時讀 App Translocation 掛載點的來源（`update::original_bundle`）。
# 版本跟著 lock 裡已經有的那份走。
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# GFN 客戶端的視窗偵測（`watcher::win32`）與工作列 widget（`widget/`）。
# 用 windows-sys 不用 windows：兩邊都只是 Win32 的 FFI 函式，沒有 COM，
# 也不會把 MSRV 頂到 rust-version 之上。
# 版本跟著 tauri 已經拉進來的那份走，免得編兩份。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  # 工作列 widget（`widget/`）。
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
] }

[dev-dependencies]
tempfile = "3"
# `widget::render` 的 `dumps_widget` 傾印 PNG 給人看。0.17 是 tauri 已經拉進來的那一份。
png = "0.17"
wiremock = "0.6"

# 發佈建置。刻意沒有 panic = "abort"：這個 codebase 的輪詢 task 裡都是
# `.lock().unwrap()`，現在一個 poisoned mutex 只殺掉那條 task，系統匣停在
# 最後一個數字，使用者按「立即更新」還有反應。改成 abort 就是整個程序消失，
# 而且預設的 panic hook 寫 stderr —— 打包後那裡沒有人接。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
