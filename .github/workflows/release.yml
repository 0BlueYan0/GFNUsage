name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要建置的既有 tag，例如 v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  guard:
    # 唯一的目的：tag 和原始碼裡的版本對不起來時，在燒掉三台 runner 之前
    # 就停下來。版本只有 src-tauri/Cargo.toml 一個來源，另外兩個是跟著它走。
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      notes_en: ${{ steps.notes.outputs.en }}
      notes_zh: ${{ steps.notes.outputs.zh }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          cargo_v=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "(.*)"$/\1/')
          pkg_v=$(node -p "require('./package.json').version")
          conf_v=$(node -p "require('./src-tauri/tauri.conf.json').version ?? ''")
          echo "tag=$tag  Cargo.toml=$cargo_v  package.json=$pkg_v  tauri.conf.json='$conf_v'"
          if [ -n "$conf_v" ]; then
            echo "::error::tauri.conf.json 不該有 version，唯一來源是 src-tauri/Cargo.toml"
            exit 1
          fi
          if [ "$tag" != "v$cargo_v" ]; then
            echo "::error::tag $tag 與 src-tauri/Cargo.toml 的 $cargo_v 不一致"
            exit 1
          fi
          if [ "$pkg_v" != "$cargo_v" ]; then
            echo "::error::package.json 的 $pkg_v 與 Cargo.toml 的 $cargo_v 不一致"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$cargo_v" >> "$GITHUB_OUTPUT"
      # 兩份 CHANGELOG 裡這一版那一段，抄進 release 說明。抄不到就停在這裡 ——
      # 「這一版改了什麼」是下載的人唯一看得到的說明，忘了產生沒有別的地方補得回來。
      - id: notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.check.outputs.version }}"
          section() {
            # 版本標題到下一個版本標題為止，前後空行去掉。conventional-changelog
            # 的 angular preset 把 minor 版標成 `# [0.2.0](…) (日期)`，patch 版
            # 標成 `## [0.1.3](…) (日期)`，兩種都要認。`### Features` 那種是節名
            # 不是下一段，所以停止條件只看一到兩個井字。檔尾 `[0.1.1]: https://…`
            # 那種連結定義是舊格式的停止條件，留著沒有壞處。
            awk -v ver="$version" '
              index($0, "# [" ver "]") == 1 || index($0, "## [" ver "]") == 1 { on = 1; next }
              on && (/^##? \[/ || /^\[[^]]+\]: /) { exit }
              on { print }
            ' "$1" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac
          }
          for file in CHANGELOG.md:en CHANGELOG.zh-TW.md:zh; do
            path="${file%%:*}"
            key="${file##*:}"
            body=$(section "$path")
            if [ -z "$body" ]; then
              echo "::error file=$path::$path 裡沒有 $version 這一段，補上再發"
              exit 1
            fi
            {
              echo "$key<<CHANGELOG_EOF"
              echo "$body"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
          done
          echo "已從兩份 CHANGELOG 取出 $version"

  # CI 只在 main、m*-* 與 PR 上跑，tag 不觸發它。沒有這一段的話，
  # 「在 main 上綠過」跟「這個 tag 是綠的」之間可以塞進任意多次修改，
  # 而建出來的東西會直接變成草稿 release 等著按發佈。
  test:
    needs: guard
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.guard.outputs.tag }}

  build:
    needs: [guard, test]
    strategy:
      # macOS 沒有人實測過。它掛掉不該把 Windows 的安裝檔一起拖下水。
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            rust-targets: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-targets: "x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.rust-targets }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 私鑰掉了就沒有升級路徑：已經裝出去的版本只認編進去的那把公鑰。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # 用 tag 本身，不要 v__VERSION__：tauri.conf.json 已經沒有 version，
          # 不必再把 action 自己那套版本偵測牽進來。
          tagName: ${{ needs.guard.outputs.tag }}
          releaseName: GFNUsage ${{ needs.guard.outputs.tag }}
          # 英文在前，中文在後，各自一整段。下載的人不一定讀中文，
          # 而 GitHub 的 release 頁沒有語言切換。
          releaseBody: |
            ## English

            ${{ needs.guard.outputs.notes_en }}

            ### Windows

            Download `GFNUsage_${{ needs.guard.outputs.version }}_x64-setup.exe`
            and run it.

            There is no code signing certificate behind this build, so
            SmartScreen will say "Windows protected your PC" and name an
            unknown publisher: choose **More info** → **Run anyway**. It
            installs into your user folder and never asks for administrator
            rights.

            ### macOS

            Not notarised, and tried on one Mac so far. macOS blocks it on first
            launch: open **System Settings → Privacy & Security**, scroll
            down, and click **Open Anyway** next to GFNUsage.

            ---

            ## 繁體中文

            ${{ needs.guard.outputs.notes_zh }}

            ### Windows

            下載 `GFNUsage_${{ needs.guard.outputs.version }}_x64-setup.exe`
            執行。

            這個專案沒有買程式碼簽章憑證，SmartScreen 會跳「已保護您的電腦」
            並顯示不明的發行者，按**其他資訊** → **仍要執行**。裝在使用者
            資料夾，不需要系統管理員權限。

            ### macOS

            沒有經過 Apple 公證，到目前只在一台 Mac 上試過。第一次打開會被擋下來，到
            **系統設定 → 隱私權與安全性**，捲到下面，在 GFNUsage 旁邊按
            **強制打開**。

            ---

            [CHANGELOG](https://github.com/0BlueYan0/GFNUsage/blob/${{ needs.guard.outputs.tag }}/CHANGELOG.md)
            · [更新紀錄](https://github.com/0BlueYan0/GFNUsage/blob/${{ needs.guard.outputs.tag }}/CHANGELOG.zh-TW.md)
          # 草稿。人工確認過再按發佈 —— 按下去那一刻使用者才收得到更新。
          releaseDraft: true
          prerelease: false
          # latest.json。releases/latest 不含 pre-release，所以上面那行不能勾。
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # 三條 matrix 會同時去找或建同一個草稿，會撞。
          retryAttempts: 2
          args: ${{ matrix.args }}
